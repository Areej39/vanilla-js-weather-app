<!--index.html weather-app-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather App</h1>
        </div>

        <form class="search-box" id="weatherForm">
            <label for="cityInput">City</label>
            <div class="searchRow">
                <input type="text" id="cityInput" placeholder="Enter city name">
                <button id="searchBtn" aria-label="Search weather for city">Search</button>
            </div>
        </form>

        <div id="errorMessage" style="display: none"></div>
    
        <div class="weather-content">
            <section class="weather-card">
                <h2 id="cityName"></h2>
                <!-- <div class="icon-wrapper">
                    <img id="weatherIcon" alt="Weather Icon">
                </div> -->
                <div class="temperature-wrapper">
                    <h2 id="temperature">30°C</h2>
                </div>
                <p id="description">Clear Sky</p>
            </section>
            
            <section class="details">
                <div class="detail-box">
                    <span class="detail-label">💧Humidity</span>    
                    <span id="humidity"></span>
                </div>
                <div class="detail-box">
                    <span class="detail-label">🌬️Wind</span>            
                    <span id="wind"></span>
                </div>
                <div class="detail-box">
                    <span class="detail-label">🌡️Feels Like</span> 
                    <span id="feelsLike"></span>
                </div>
            </section>
        </div>
        
        <div class="loadingIndicator" style="display: none">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
